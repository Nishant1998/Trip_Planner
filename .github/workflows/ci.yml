name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.11'}
      - name: Frontend quality and build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm audit --audit-level=high
      - name: Backend quality and dependency audit
        working-directory: backend
        run: |
          python -m pip install -r requirements.lock
          python -m pip install ruff pip-audit
          ruff check app scripts
          python -m compileall -q app scripts
          pip-audit -r requirements.lock --strict
  containers:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - name: Build images without application secrets
        run: |
          docker build -t tripai-backend:check backend
          docker build --build-arg VITE_GOOGLE_CLIENT_ID=container-check.apps.googleusercontent.com -t tripai-web:check frontend
          docker run --rm tripai-web:check caddy validate --config /etc/caddy/Caddyfile
      - name: Check backend startup without a live database or model call
        run: |
          docker run -d --name tripai-check -p 127.0.0.1:8000:8000 \
            -e DATABASE_URL=postgresql://unused@127.0.0.1:1/unused \
            -e APP_ENV=production -e RIYA_AUTH_MODE=google -e TEST_MODE=false \
            -e RIYA_AUTO_MIGRATE=false -e LOG_FILE_ENABLED=false \
            -e GOOGLE_OAUTH_CLIENT_ID=container-check.apps.googleusercontent.com \
            -e CORS_ORIGINS=http://localhost:8080 tripai-backend:check
          for attempt in $(seq 1 30); do
            echo "Backend startup probe $attempt"
            if curl --fail --silent http://localhost:8000/health/live; then exit 0; fi
            sleep 2
          done
          docker logs tripai-check
          exit 1
      - name: Remove temporary CI container
        if: always()
        run: docker rm -f tripai-check || true
