<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="meshDusk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="85%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <radialGradient id="glowOrb1" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Neutral Gradient Canvas -->
  <rect width="800" height="450" fill="url(#meshDusk)" />
  <rect width="800" height="450" fill="url(#glowOrb1)" />
  <!-- Minimalist Longitude & Route Arcs -->
  <path d="M 0 350 Q 400 150 800 300" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.3" />
  <path d="M 0 280 Q 400 80 800 230" fill="none" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="8,6" opacity="0.4" />
  <path d="M 0 420 Q 400 220 800 370" fill="none" stroke="#4f46e5" stroke-width="1.5" opacity="0.2" />
  <!-- Transit Geo Nodes -->
  <circle cx="220" cy="205" r="4" fill="#ffffff" opacity="0.8" />
  <circle cx="220" cy="205" r="14" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.3" />
  <circle cx="580" cy="180" r="5" fill="#a5b4fc" opacity="0.9" />
  <circle cx="580" cy="180" r="18" fill="none" stroke="#c7d2fe" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
</svg>
